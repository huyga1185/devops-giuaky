services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: matkhau0biet
      MYSQL_DATABASE: sinhvien
    ports:
      - "3307:3306"
    volumes:
      - ./backend/db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pmatkhau0biet"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend